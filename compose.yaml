services:
  mongo:
    image: mongo:8.0
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all', '--port', '27028']
    ports:
      - '127.0.0.1:27028:27028'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --port 27028 --quiet --eval
          'try { rs.status() } catch { rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27028"}]}) }'
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mongo-data:
